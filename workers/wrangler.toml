name = "aiva"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[triggers]
crons = ["0 19 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "aiva-db"
database_id = "YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "YOUR_KV_NAMESPACE_ID"

[vars]
# GEMINI_API_KEY is stored as a secret via `wrangler secret put GEMINI_API_KEY`
