name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'capacitor.config.json'
      - 'android-res/**'
      - 'scripts/process-kasy-brand-assets.mjs'
      - 'scripts/generate-android-apk-assets.mjs'
      - 'scripts/apply-brand-package.mjs'
      - 'scripts/generate-kasy-brand.mjs'
      - 'scripts/prepare-capacitor-shell.mjs'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android \
            @capacitor/local-notifications @capacitor/preferences @capacitor/haptics \
            @capacitor/app @capacitor/splash-screen

      - name: Build Package A brand assets
        run: node scripts/process-kasy-brand-assets.mjs

      - name: Build Capacitor web shell
        run: node scripts/prepare-capacitor-shell.mjs

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Copy native Java sources
        run: |
          mkdir -p android/app/src/main/java/com/capacitorjs/plugins/localnotifications/
          mkdir -p android/app/src/main/java/com/aiva/assistant/
          cp android-res/java/com/capacitorjs/plugins/localnotifications/AivaNotificationReceiver.java \
             android/app/src/main/java/com/capacitorjs/plugins/localnotifications/
          cp android-res/java/com/aiva/assistant/AivaCalendarPlugin.java \
             android/app/src/main/java/com/aiva/assistant/
          cp android-res/java/com/aiva/assistant/AivaShortcutPlugin.java \
             android/app/src/main/java/com/aiva/assistant/
          cp android-res/java/com/aiva/assistant/AivaVolumeKeyHandler.java \
             android/app/src/main/java/com/aiva/assistant/
          cp android-res/java/com/aiva/assistant/AivaShortcutLauncher.java \
             android/app/src/main/java/com/aiva/assistant/
          cp android-res/java/com/aiva/assistant/AivaShortcutAccessibilityService.java \
             android/app/src/main/java/com/aiva/assistant/
          cp android-res/java/com/aiva/assistant/AivaDevicePlugin.java \
             android/app/src/main/java/com/aiva/assistant/

      - name: Patch AndroidManifest and register AivaCalendar plugin
        run: python3 android-res/patch-local-notifications.py

      - name: Copy ProGuard rules
        run: cp android-res/proguard-rules.pro android/app/proguard-rules.pro

      - name: Generate launcher icons and native splash
        run: node scripts/generate-android-apk-assets.mjs android/app/src/main/res

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASY-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v-$(date +%Y%m%d%H%M)-$(git rev-parse --short HEAD)"
          cp android/app/build/outputs/apk/release/app-release.apk KASY.apk
          gh release create "$TAG" KASY.apk \
            --title "KASY $TAG" \
            --notes "Автоматичен build от commit $(git rev-parse --short HEAD)" \
            --latest
