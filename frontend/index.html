<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AIVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.06);
      --text: #f0f0f2;
      --text-secondary: rgba(255, 255, 255, 0.45);
      --accent: #ff3b5c;
      --accent-glow: rgba(255, 59, 92, 0.35);
      --success: #2dd4a8;
      --success-glow: rgba(45, 212, 168, 0.2);
      --radius: 20px;
      --radius-sm: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 50% 20%, rgba(255, 59, 92, 0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(100, 60, 255, 0.03) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100%;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 2rem 0 1rem;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      flex: 1;
      text-align: left;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--text);
      opacity: 0.9;
    }

    .tagline {
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--text-secondary);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .admin-link,
    .ghost-btn,
    .icon-btn,
    .view-tab {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 13px;
      font: inherit;
      font-size: 0.78rem;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .admin-link:hover,
    .ghost-btn:hover,
    .icon-btn:hover,
    .view-tab:hover,
    .view-tab.active {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    .view-tab.active {
      color: white;
      box-shadow: inset 0 0 0 1px rgba(255, 59, 92, 0.35);
    }

    /* Record Button */
    .voice-section {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 0 1.5rem;
      width: 100%;
    }

    .record-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .record-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 3;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease;
      box-shadow: 0 0 0 0 var(--accent-glow),
                  0 4px 24px rgba(255, 59, 92, 0.3);
    }

    .record-btn:hover {
      transform: scale(1.06);
    }

    .record-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .record-btn:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    .record-btn svg {
      width: 28px;
      height: 28px;
      fill: white;
      transition: opacity 0.2s;
    }

    .record-btn .icon-stop {
      display: none;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 4px;
    }

    .record-btn.recording svg { display: none; }
    .record-btn.recording .icon-stop { display: block; }

    .record-btn.recording {
      box-shadow: 0 0 0 0 var(--accent-glow),
                  0 4px 40px rgba(255, 59, 92, 0.5);
      animation: btn-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow), 0 4px 40px rgba(255, 59, 92, 0.5); }
      50% { box-shadow: 0 0 0 16px transparent, 0 4px 60px rgba(255, 59, 92, 0.6); }
    }

    /* Orbital rings */
    .orbit {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 59, 92, 0.08);
      pointer-events: none;
      transition: opacity 0.4s, transform 0.4s;
    }

    .orbit-1 { width: 120px; height: 120px; }
    .orbit-2 { width: 150px; height: 150px; }

    .record-btn.recording ~ .orbit-1 {
      animation: orbit-spin 3s linear infinite;
      border-color: rgba(255, 59, 92, 0.2);
    }

    .record-btn.recording ~ .orbit-2 {
      animation: orbit-spin 5s linear infinite reverse;
      border-color: rgba(255, 59, 92, 0.12);
    }

    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Waveform visualizer */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 32px;
      margin-top: 2rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .waveform.active { opacity: 1; }

    .waveform span {
      width: 3px;
      height: 8px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.6;
    }

    .waveform.active span {
      animation: wave 1.2s ease-in-out infinite;
    }

    .waveform span:nth-child(1) { animation-delay: 0s; }
    .waveform span:nth-child(2) { animation-delay: 0.1s; }
    .waveform span:nth-child(3) { animation-delay: 0.2s; }
    .waveform span:nth-child(4) { animation-delay: 0.3s; }
    .waveform span:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { height: 8px; opacity: 0.4; }
      50% { height: 28px; opacity: 1; }
    }

    /* Status */
    .status {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 1.5rem;
      text-align: center;
      min-height: 1.2rem;
      transition: color 0.3s;
    }

    .status.active {
      color: var(--accent);
    }

    /* Task confirmation toast */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      width: calc(100% - 32px);
      max-width: 400px;
      background: rgba(20, 20, 28, 0.85);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      z-index: 100;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.3s;
      opacity: 0;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success-glow);
    }

    .toast-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--success);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .toast-content {
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
      color: var(--text);
    }

    .toast-meta {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    .toast-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Tasks panel */
    .tasks-panel {
      width: 100%;
      margin-top: auto;
      padding-top: 1rem;
    }

    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .tasks-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .tasks-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tasks-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .tasks-count {
      font-size: 0.7rem;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .calendar-toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    .range-control,
    .view-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .range-control {
      justify-content: space-between;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .range-label {
      flex: 1;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      text-transform: capitalize;
    }

    .icon-btn {
      min-width: 40px;
      min-height: 36px;
      padding: 8px 12px;
    }

    .ghost-btn.primary-action {
      background: var(--accent);
      border-color: transparent;
      color: white;
      font-weight: 600;
    }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
    }

    .task-item:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .task-item:hover {
        background: var(--surface-hover);
      }
    }

    .task-check {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background: transparent;
    }

    .task-check:hover {
      border-color: var(--success);
      background: var(--success-glow);
    }

    .task-check svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: var(--success);
      stroke-width: 2.5;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .task-check:hover svg {
      opacity: 1;
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.35;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .priority-pill {
      flex: 0 0 auto;
      font-size: 0.62rem;
      color: white;
      background: rgba(255, 59, 92, 0.22);
      border: 1px solid rgba(255, 59, 92, 0.28);
      border-radius: 999px;
      padding: 2px 7px;
    }

    .task-info {
      font-size: 0.68rem;
      color: var(--text-secondary);
      margin-top: 3px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .task-note {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 0.72rem;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 0;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 300;
    }

    .empty-state.small {
      padding: 1rem 0;
      font-size: 0.76rem;
    }

    .agenda-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      touch-action: pan-y;
    }

    .agenda-grid.view-three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .agenda-grid.view-week {
      grid-template-columns: repeat(7, minmax(120px, 1fr));
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .calendar-day,
    .unscheduled-block,
    .month-agenda {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      min-width: 0;
    }

    .calendar-day.is-today,
    .month-cell.is-today {
      border-color: rgba(255, 59, 92, 0.4);
      box-shadow: 0 0 0 1px rgba(255, 59, 92, 0.14);
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--text);
      text-transform: capitalize;
    }

    .day-name {
      display: block;
      color: var(--text-secondary);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .day-count,
    .month-count {
      font-size: 0.68rem;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 7px;
    }

    .day-stack {
      display: grid;
      gap: 8px;
    }

    .unscheduled-block {
      margin-top: 12px;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 7px;
      touch-action: pan-y;
    }

    .month-weekday {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.68rem;
      padding: 0 0 4px;
    }

    .month-cell {
      min-height: 72px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      cursor: pointer;
    }

    .month-cell.muted {
      opacity: 0.38;
    }

    .month-date {
      font-size: 0.78rem;
      font-weight: 600;
    }

    .month-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.9;
    }

    .priority-1 { background: #ff3b5c; }
    .priority-2 { background: #ff8f3b; }
    .priority-3 { background: #f5d66b; }
    .priority-4 { background: #62d9b7; }
    .priority-5 { background: #78a8ff; }

    .month-agenda {
      margin-top: 12px;
    }

    .task-modal {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.56);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .task-modal.visible {
      display: flex;
    }

    .modal-card {
      width: min(720px, 100%);
      max-height: calc(100vh - 32px);
      overflow: auto;
      background: rgba(18, 18, 26, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.4);
    }

    .modal-header,
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .form-grid label,
    .full-field {
      display: grid;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 500;
    }

    .full-field {
      grid-column: 1 / -1;
    }

    .form-grid input,
    .form-grid select,
    .form-grid textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font: inherit;
      padding: 11px 12px;
      outline: none;
    }

    .form-grid select option {
      background: #15151d;
      color: var(--text);
    }

    .form-grid textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.45;
    }

    .duplicate-panel {
      grid-column: 1 / -1;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.035);
    }

    .duplicate-panel p {
      color: var(--text-secondary);
      font-size: 0.72rem;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .danger-btn {
      color: #ff8aa0;
      border-color: rgba(255, 59, 92, 0.25);
    }

    .save-btn {
      background: var(--accent);
      border-color: transparent;
      color: white;
      font-weight: 700;
    }

    body.compact-calendar .calendar-day,
    body.compact-calendar .task-item {
      padding: 10px;
    }

    /* Error toast */
    .error-toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      background: rgba(255, 59, 92, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 59, 92, 0.2);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.82rem;
      color: var(--accent);
      z-index: 100;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    }

    .error-toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 380px) {
      .record-btn { width: 76px; height: 76px; }
      .orbit-1 { width: 105px; height: 105px; }
      .orbit-2 { width: 130px; height: 130px; }
      .record-wrapper { width: 140px; height: 140px; }
    }

    @media (max-width: 720px) {
      .app {
        max-width: 420px;
      }

      .header {
        align-items: flex-start;
      }

      .agenda-grid.view-three,
      .agenda-grid.view-week {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding-bottom: 4px;
      }

      .agenda-grid.view-three .calendar-day,
      .agenda-grid.view-week .calendar-day {
        min-width: 82%;
        scroll-snap-align: start;
      }

      .tasks-header {
        align-items: flex-start;
      }

      .view-tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }

      .view-tab {
        padding-inline: 8px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .modal-actions {
        flex-wrap: wrap;
      }

      .modal-actions button {
        flex: 1;
      }

      .month-cell {
        min-height: 56px;
        padding: 6px;
      }
    }

    @media (min-height: 800px) {
      .voice-section { padding: 4rem 0; }
    }

    @media (max-height: 600px) {
      .voice-section { padding: 1.5rem 0; }
      .header { padding: 1rem 0 0.5rem; }
    }

    /* PWA install hint */
    @media (display-mode: standalone) {
      .header { padding-top: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">AIVA</div>
        <div class="tagline">гласов асистент за задачи</div>
      </div>
      <a class="admin-link" href="./admin.html">Admin</a>
    </header>

    <section class="voice-section">
      <div class="record-wrapper">
        <button class="record-btn" id="recordBtn" aria-label="Запис">
          <svg viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span class="icon-stop"></span>
        </button>
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
      </div>

      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Докоснете за запис</div>
    </section>

    <section class="tasks-panel" id="tasksPanel">
      <div class="tasks-header">
        <div class="tasks-heading">
          <span class="tasks-title">Календар</span>
          <span class="tasks-count" id="tasksCount">0</span>
        </div>
        <div class="tasks-actions">
          <button class="ghost-btn primary-action" id="addTaskBtn" type="button">+ Задача</button>
        </div>
      </div>

      <div class="calendar-toolbar">
        <div class="range-control">
          <button class="icon-btn" id="prevRange" type="button" aria-label="Предишен период">‹</button>
          <div class="range-label" id="rangeLabel">Днес</div>
          <button class="icon-btn" id="nextRange" type="button" aria-label="Следващ период">›</button>
        </div>
        <div class="view-tabs" role="tablist" aria-label="Календарни изгледи">
          <button class="view-tab active" data-view="day" type="button" aria-pressed="true">Ден</button>
          <button class="view-tab" data-view="three" type="button" aria-pressed="false">3 дни</button>
          <button class="view-tab" data-view="week" type="button" aria-pressed="false">Календар</button>
          <button class="view-tab" data-view="month" type="button" aria-pressed="false">Месец</button>
          <button class="view-tab" id="todayBtn" type="button">Днес</button>
        </div>
      </div>

      <div id="tasksContainer">
        <div class="empty-state">Все още няма задачи</div>
      </div>
    </section>
  </div>

  <!-- Task details modal -->
  <div class="task-modal" id="taskModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Детайли за задачата</div>
        <button class="modal-close" id="closeTaskModal" type="button" aria-label="Затвори">×</button>
      </div>

      <form id="taskForm">
        <input id="taskId" name="id" type="hidden">
        <div class="form-grid">
          <label class="full-field">
            Задача / ангажимент
            <input name="content" required placeholder="Напр. Обади се на клиента">
          </label>

          <label>
            Дата
            <input name="due_date" type="date">
          </label>
          <label>
            Час
            <input name="due_time" type="time">
          </label>
          <label>
            Приоритет
            <select name="priority">
              <option value="1">П1 - висок</option>
              <option value="2">П2</option>
              <option value="3">П3</option>
              <option value="4">П4</option>
              <option value="5">П5 - нисък</option>
            </select>
          </label>
          <label>
            Емоция / контекст
            <select name="emotion">
              <option value="neutral">neutral</option>
              <option value="urgent">urgent</option>
              <option value="stress">stress</option>
              <option value="tired">tired</option>
            </select>
          </label>
          <label>
            Продължителност (мин)
            <input name="estimated_minutes" type="number" min="0" max="1440">
          </label>
          <label>
            Локация
            <input name="location" placeholder="Офис, онлайн, адрес...">
          </label>
          <label>
            Тагове
            <input name="tags" placeholder="работа, лично, важни">
          </label>
          <label>
            Повторяемост
            <input name="repeat_rule" placeholder="всеки понеделник, месечно...">
          </label>
          <label class="full-field">
            Допълнителна информация
            <textarea name="notes" placeholder="Контекст, линкове, подзадачи, инструкции..."></textarea>
          </label>

          <div class="duplicate-panel">
            <p><strong>Мултиплициране:</strong> въведи по един ред във формат <code>YYYY-MM-DD HH:MM</code>, например <code>2026-06-08 09:30</code>.</p>
            <label class="full-field">
              Дни и часове за копия
              <textarea id="duplicateRows" placeholder="2026-06-08 09:30&#10;2026-06-10 14:00"></textarea>
            </label>
          </div>
        </div>

        <div class="modal-actions">
          <button class="ghost-btn danger-btn" id="deleteTaskBtn" type="button">Изтрий</button>
          <button class="ghost-btn" id="duplicateTaskBtn" type="button">Мултиплицирай</button>
          <button class="ghost-btn save-btn" type="submit">Запази</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task saved toast -->
  <div class="toast" id="toast">
    <div class="toast-header">
      <div class="toast-dot"></div>
      <div class="toast-title">Запазена</div>
    </div>
    <div class="toast-content" id="toastContent"></div>
    <div class="toast-meta" id="toastMeta"></div>
  </div>

  <!-- Error toast -->
  <div class="error-toast" id="errorToast"></div>

  <script src="config.js"></script>
  <script src="settings.js"></script>
  <script src="lib/geminilive.js"></script>
  <script src="lib/mediaUtils.js"></script>
  <script src="app.js"></script>
</body>
</html>
