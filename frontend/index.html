<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050508">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AIVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.06);
      --text: #f0f0f2;
      --text-secondary: rgba(255, 255, 255, 0.45);
      --accent: #ff3b5c;
      --accent-glow: rgba(255, 59, 92, 0.35);
      --success: #2dd4a8;
      --success-glow: rgba(45, 212, 168, 0.2);
      --radius: 20px;
      --radius-sm: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(var(--safe-top) + 20px) 20px calc(var(--safe-bottom) + 20px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 50% 20%, rgba(255, 59, 92, 0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(100, 60, 255, 0.03) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100%;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 2rem 0 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 4px;
      color: var(--text);
      opacity: 0.9;
    }

    .tagline {
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--text-secondary);
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    /* Record Button */
    .voice-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 0;
      width: 100%;
    }

    .record-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .record-btn {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 3;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.3s ease;
      box-shadow: 0 0 0 0 var(--accent-glow),
                  0 4px 24px rgba(255, 59, 92, 0.3);
    }

    .record-btn:hover {
      transform: scale(1.06);
    }

    .record-btn:active:not(:disabled) {
      transform: scale(0.94);
    }

    .record-btn:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    .record-btn svg {
      width: 28px;
      height: 28px;
      fill: white;
      transition: opacity 0.2s;
    }

    .record-btn .icon-stop {
      display: none;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 4px;
    }

    .record-btn.recording svg { display: none; }
    .record-btn.recording .icon-stop { display: block; }

    .record-btn.recording {
      box-shadow: 0 0 0 0 var(--accent-glow),
                  0 4px 40px rgba(255, 59, 92, 0.5);
      animation: btn-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow), 0 4px 40px rgba(255, 59, 92, 0.5); }
      50% { box-shadow: 0 0 0 16px transparent, 0 4px 60px rgba(255, 59, 92, 0.6); }
    }

    /* Orbital rings */
    .orbit {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(255, 59, 92, 0.08);
      pointer-events: none;
      transition: opacity 0.4s, transform 0.4s;
    }

    .orbit-1 { width: 120px; height: 120px; }
    .orbit-2 { width: 150px; height: 150px; }

    .record-btn.recording ~ .orbit-1 {
      animation: orbit-spin 3s linear infinite;
      border-color: rgba(255, 59, 92, 0.2);
    }

    .record-btn.recording ~ .orbit-2 {
      animation: orbit-spin 5s linear infinite reverse;
      border-color: rgba(255, 59, 92, 0.12);
    }

    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Waveform visualizer */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 32px;
      margin-top: 2rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .waveform.active { opacity: 1; }

    .waveform span {
      width: 3px;
      height: 8px;
      background: var(--accent);
      border-radius: 2px;
      opacity: 0.6;
    }

    .waveform.active span {
      animation: wave 1.2s ease-in-out infinite;
    }

    .waveform span:nth-child(1) { animation-delay: 0s; }
    .waveform span:nth-child(2) { animation-delay: 0.1s; }
    .waveform span:nth-child(3) { animation-delay: 0.2s; }
    .waveform span:nth-child(4) { animation-delay: 0.3s; }
    .waveform span:nth-child(5) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { height: 8px; opacity: 0.4; }
      50% { height: 28px; opacity: 1; }
    }

    /* Status */
    .status {
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 1.5rem;
      text-align: center;
      min-height: 1.2rem;
      transition: color 0.3s;
    }

    .status.active {
      color: var(--accent);
    }

    /* Task confirmation toast */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      width: calc(100% - 32px);
      max-width: 400px;
      background: rgba(20, 20, 28, 0.85);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      z-index: 100;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.3s;
      opacity: 0;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success-glow);
    }

    .toast-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--success);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .toast-content {
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
      color: var(--text);
    }

    .toast-meta {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--text-secondary);
    }

    .toast-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Tasks panel */
    .tasks-panel {
      width: 100%;
      margin-top: auto;
      padding-top: 1rem;
    }

    .tasks-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .tasks-title {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .tasks-count {
      font-size: 0.7rem;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s, transform 0.2s;
    }

    .task-item:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .task-item:hover {
        background: var(--surface-hover);
      }
    }

    .task-check {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-check:hover {
      border-color: var(--success);
      background: var(--success-glow);
    }

    .task-check svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: var(--success);
      stroke-width: 2.5;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .task-check:hover svg {
      opacity: 1;
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-text {
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.35;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-info {
      font-size: 0.68rem;
      color: var(--text-secondary);
      margin-top: 3px;
      display: flex;
      gap: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 0;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 300;
    }

    /* Error toast */
    .error-toast {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      background: rgba(255, 59, 92, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 59, 92, 0.2);
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 0.82rem;
      color: var(--accent);
      z-index: 100;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
    }

    .error-toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 380px) {
      .record-btn { width: 76px; height: 76px; }
      .orbit-1 { width: 105px; height: 105px; }
      .orbit-2 { width: 130px; height: 130px; }
      .record-wrapper { width: 140px; height: 140px; }
    }

    @media (min-height: 800px) {
      .voice-section { padding: 4rem 0; }
    }

    @media (max-height: 600px) {
      .voice-section { padding: 1.5rem 0; }
      .header { padding: 1rem 0 0.5rem; }
    }

    /* PWA install hint */
    @media (display-mode: standalone) {
      .header { padding-top: 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">AIVA</div>
      <div class="tagline">гласов асистент за задачи</div>
    </header>

    <section class="voice-section">
      <div class="record-wrapper">
        <button class="record-btn" id="recordBtn" aria-label="Запис">
          <svg viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span class="icon-stop"></span>
        </button>
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
      </div>

      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">Докоснете за запис</div>
    </section>

    <section class="tasks-panel" id="tasksPanel">
      <div class="tasks-header">
        <span class="tasks-title">Задачи</span>
        <span class="tasks-count" id="tasksCount">0</span>
      </div>
      <div id="tasksContainer">
        <div class="empty-state">Все още няма задачи</div>
      </div>
    </section>
  </div>

  <!-- Task saved toast -->
  <div class="toast" id="toast">
    <div class="toast-header">
      <div class="toast-dot"></div>
      <div class="toast-title">Запазена</div>
    </div>
    <div class="toast-content" id="toastContent"></div>
    <div class="toast-meta" id="toastMeta"></div>
  </div>

  <!-- Error toast -->
  <div class="error-toast" id="errorToast"></div>

  <script src="app.js"></script>
</body>
</html>
