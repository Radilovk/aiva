<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIVA — Гласов мениджър на задачи</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ff4444, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #888;
      margin-bottom: 3rem;
      font-size: 1.1rem;
    }

    .record-container {
      position: relative;
      margin-bottom: 3rem;
    }

    .record-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #e63946, #cc2936);
      box-shadow: 0 8px 32px rgba(230, 57, 70, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .record-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(230, 57, 70, 0.6);
    }

    .record-btn:active {
      transform: scale(0.95);
    }

    .record-btn.recording {
      animation: pulse 1.5s infinite;
      background: linear-gradient(145deg, #ff1744, #e63946);
    }

    .record-btn svg {
      width: 48px;
      height: 48px;
      fill: white;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(230, 57, 70, 0.4); }
      50% { box-shadow: 0 8px 48px rgba(230, 57, 70, 0.8); }
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(230, 57, 70, 0.3);
      z-index: 1;
    }

    .record-btn.recording ~ .ring {
      animation: ring-expand 1.5s infinite;
    }

    @keyframes ring-expand {
      0% { width: 120px; height: 120px; opacity: 1; }
      100% { width: 200px; height: 200px; opacity: 0; }
    }

    .status {
      font-size: 1rem;
      color: #888;
      margin-bottom: 2rem;
      min-height: 1.5rem;
      text-align: center;
    }

    .status.active {
      color: #ff6b6b;
    }

    .task-confirmation {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      display: none;
    }

    .task-confirmation.visible {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-confirmation h3 {
      color: #4ecdc4;
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .task-confirmation .task-content {
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .task-confirmation .task-meta {
      color: #888;
      font-size: 0.85rem;
    }

    .task-confirmation .task-meta span {
      margin-right: 12px;
    }

    .tasks-list {
      max-width: 400px;
      width: 100%;
      margin-top: 2rem;
    }

    .tasks-list h3 {
      color: #888;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .task-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-item .task-text {
      flex: 1;
    }

    .task-item .done-btn {
      background: none;
      border: 2px solid #4ecdc4;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .task-item .done-btn:hover {
      background: #4ecdc4;
    }
  </style>
</head>
<body>
  <h1>AIVA</h1>
  <p class="subtitle">Гласов мениджър на задачи</p>

  <div class="record-container">
    <button class="record-btn" id="recordBtn" aria-label="Запис">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <div class="ring"></div>
  </div>

  <div class="status" id="status">Натиснете бутона за запис</div>

  <div class="task-confirmation" id="taskConfirmation">
    <h3>✓ Задачата е запазена</h3>
    <div class="task-content" id="taskContent"></div>
    <div class="task-meta">
      <span id="taskEmotion"></span>
      <span id="taskPriority"></span>
      <span id="taskDue"></span>
    </div>
  </div>

  <div class="tasks-list" id="tasksList">
    <h3>Активни задачи</h3>
    <div id="tasksContainer"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
